spring.application.name=shopsmart-ai
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopsmart}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Schema is owned by schema.sql (idempotent); Hibernate only maps to it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# DEV DEFAULT ONLY - override JWT_SECRET (min 32 chars) outside local dev
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32chars-min}
app.jwt.expiration-minutes=120
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174}
app.admin.email=${ADMIN_EMAIL:admin@shopsmart.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# ---- Spring AI: Gemini through its OpenAI-compatible endpoint (key comes from the GEMINI_API_KEY env var) ----
spring.ai.openai.api-key=${GEMINI_API_KEY:not-configured}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=${GEMINI_MODEL:gemini-3.5-flash}

# ---- Embeddings (RAG): Gemini through the same OpenAI-compatible endpoint ----
spring.ai.openai.embedding.embeddings-path=/embeddings
spring.ai.openai.embedding.options.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
# NOTE: no 'dimensions' option is sent: Gemini's OpenAI-compatible endpoint may reject it. gemini-embedding-001 returns
# 3072 values; rag/Vectors.fit() truncates to EMBEDDING_DIMENSION and re-normalises (valid for this Matryoshka model).
# ---- RAG settings (dimension MUST match the policy_documents.embedding column) ----
app.rag.embedding-dimension=${EMBEDDING_DIMENSION:768}
app.rag.top-k=5
app.rag.seed-sample=${RAG_SEED_SAMPLE:true}
# evidence labels come from cosine similarity of the best cited chunk (heuristic - tune on your own documents)
app.rag.min-score=0.55
app.rag.medium-score=0.65
app.rag.high-score=0.75
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=45s
